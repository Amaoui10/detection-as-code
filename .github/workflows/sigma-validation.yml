name: Sigma Rules Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Sigma CLI
        run: pip install sigma-cli

      - name: Validate Sigma rules
        run: sigma check rules/windows/*.yml

      - name: Install RSigma
        run: |
          curl -fsSL -o rsigma.tar.gz \
            https://github.com/timescale/rsigma/releases/download/v0.25.0/rsigma-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf rsigma.tar.gz
          sudo install -m 0755 rsigma /usr/local/bin/rsigma
          rsigma --version

      - name: Run RSigma backtest
        run: |
          rsigma rule backtest \
            -r rules/windows/ \
            --corpus tests/events/windows/ \
            --expectations tests/expectations.yml \
            --unexpected fail

      