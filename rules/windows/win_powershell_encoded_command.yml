
title: PowerShell Encoded Command Execution
id: 8b71e6c2-5d44-4f90-a318-2e61c4a79b03
status: test
description: Detects PowerShell processes launched with the EncodedCommand option.
author: Detection as Code Pipeline
date: 2026-10-28
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_encoded:
        CommandLine|contains: '-EncodedCommand'
    condition: selection_img and selection_encoded
falsepositives:
    - Legitimate administrative scripts using encoded commands
level: medium
tags:
    - attack.execution
    - attack.t1059.001
